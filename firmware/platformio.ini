; Tarot pad firmware
; Target: Adafruit ESP32-S3 Feather 4MB Flash / 2MB PSRAM (PID 5477)
;         + Adafruit 2.9" Grayscale eInk FeatherWing, SSD1680 (PID 4777)

[platformio]
default_envs = tarot

[env]
; pioarduino platform pinned for reproducible builds (Arduino-ESP32 core 3.3.7)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit EPD
    adafruit/Adafruit GFX Library
    adafruit/Adafruit MAX1704X

[env:hwcheck]
build_src_filter = +<hwcheck/>

[env:cardview]
build_src_filter = +<cardview/>

[env:deckview]
build_src_filter = +<deckview/> +<common/>

[env:refreshtest]
build_src_filter = +<refreshtest/>

[env:tarot]
extra_scripts = pre:build_time.py
build_src_filter = +<tarot/> +<common/>

[env:battest]
build_src_filter = +<battest/>
